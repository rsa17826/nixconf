host: "127.0.0.1"
port: 8080
root: "~/nixconf/vm"

http_authenticator:
  domain_controller: wsgidav.dc.simple_dc.SimpleDomainController
  accept_basic: true
  accept_digest: false
  default_to_digest: false

simple_dc:
  user_mapping:
    "/":
      "anonymous":
        password: "a"

cors:
  allow_origin: "*"
