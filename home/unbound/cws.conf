server:
  # Define a local zone for the target domain as transparent or redirect
  local-zone: "chromewebstore.google.com." redirect

  # Point requests for the Chrome Web Store to your local loopback address
  local-data: "chromewebstore.google.com. A 127.0.0.1"
  local-data: "chromewebstore.google.com. AAAA ::1"
