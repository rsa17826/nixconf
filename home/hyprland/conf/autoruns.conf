exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME QT_STYLE_OVERRIDE
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark
exec-once = awww-daemon
exec-once = ~/.config/hypr/scripts/random-wallpapers.sh 30
exec-once = pkill -9 codium
exec-once = ~/.config/hypr/scripts/audacity-kill-dialog.sh
exec-once = progress-daemon &
exec-once = gpu-screen-recorder -w screen -f 60 -a default_output -r 300 -c mp4 -o ~/videos/flashback &
exec-once = qs -p ~/nixconf/quickshell/bar/
exec-once = python -m http.server -d ~/projects/jira-project-ui/ 15432
# Watch for copy events and save them to cliphist
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard regular
exec-once = kitten panel --edge=background -o background_opacity=0.2 --margin-top 30 -o background=black dgop

# exec-once = ~/.config/hypr/scripts/edge-focus.sh