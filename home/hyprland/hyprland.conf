# Modern Hyprland syntax for the progress window
windowrule = workspace 1, match:class ^codium$, match:title negative:^(Save As|Open File)$
windowrule = float true, match:title ^(Save As|Open File)$, match:class ^codium$, center 1, size (monitor_w*.8) (monitor_h*.8), move ((monitor_w*0.5)-(monitor_w*.8/2)) ((monitor_h*0.5)-(monitor_h*.8/2)), dim_around 1, stay_focused 0
windowrule = opacity 1.0 1.0, match:title ^Global Progress$
windowrule = float true, match:title ^Global Progress$
windowrule = float true, match:title ^Save As$, match:class ^brave-browser$
windowrule = float true, match:title ^Save File$, match:class ^brave$, center 1, size (monitor_w*.8) (monitor_h*.8), move ((monitor_w*0.5)-(monitor_w*.8/2)) ((monitor_h*0.5)-(monitor_h*.8/2)), dim_around 1, stay_focused 0
windowrule = match:title ^Beatblock$, match:class ^Beatblock$, fullscreen on
windowrule = workspace 2, match:class ^brave-browser$



# /home/nyix/.cargo/bin/theclicker run -d"/dev/input/event0" -c25 -C0 -l273 -H --grab
windowrule = no_max_size 1, match:class ^steam_app_default$, match:title ^Eets$
windowrule = fullscreen 1, match:class ^steam_app_default$, match:title ^Eets$
windowrule = fullscreen_state 2, match:class ^steam_app_default$, match:title ^Eets$
# windowrule = size 300 40, match:title ^Global Progress$

windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:title ^Global Progress$

windowrule = pin true, match:title ^HyprSpy$
windowrule = float true, match:title ^HyprSpy$
windowrule = pin true, match:title ^Global Progress$

windowrule = no_focus true, match:title ^Global Progress$

windowrule = no_blur true, match:title ^Global Progress$
windowrule = decorate false, match:title ^Global Progress$

bind = , Num_Lock, exec,
# device {
