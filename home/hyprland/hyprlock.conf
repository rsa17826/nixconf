general {
  no_fade_in = true
  no_fade_out = true
  ignore_empty_input=true
  immediate_render=true
  hide_cursor = true
  grace = 0
  disable_loading = true
}

background {
  monitor =
  path = ~/.config/hypr/wallpapers/wallpaper.png
  color = rgba(25, 20, 20, 1.0)
  crossfade_time = 0
}
animations={
  enabled=false
  bezier = linear, 0, 1, 0, 0
  animation = fade, 0, 1.8, linear
}
label {
  monitor =
  text = cmd[update:1000] echo -e "$(LC_TIME=en_US.UTF-8 date +"%A, %B %d")"
  color = rgba(141, 0, 0, 0.9)
  font_size = 25
  font_family = SF Pro Display Semibold
  position = 0, 350
  halign = center
  valign = center
}
label {
  monitor =
  text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
  color = rgba(223, 0, 0, 0.9)
  font_size = 120
  font_family = SF Pro Display Bold
  position = 0, 230
  halign = center
  valign = center
}
