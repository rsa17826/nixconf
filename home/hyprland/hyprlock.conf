input-field {
  size = 0%, 0k%
  outline_thickness = 3
  inner_color = rgba(0, 0, 0, 0.0) # no fill

  outer_color = rgba(0000ffff)
  check_color=rgba(00ff00ff)
  fail_color=rgba(ff0000ff)

  font_color = rgba(143, 143, 143, 0)
  fade_on_empty = false
  rounding = 100

  position = 0, -420
  halign = center
  valign = center
}