set -g status on
set -g status-interval 0
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green][#S] "
set -g status-justify centre

# Read the unique @pane_timer assigned specifically to the active pane
set -g status-left "#[fg=yellow]#{@pane_timer} "
# Enable full mouse control (clicking tabs, resizing panes, and scrolling)
set -g mouse on

# Prevent scrolling from sending Up/Down arrow keys in normal shell prompts
# This forces tmux to enter Copy Mode immediately when you scroll up
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-bindkey -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Optional: Double click to select a word and keep it highlighted
bind-key -T copy-mode-vi DoubleClick1Pane send-keys -X select-word
bind-key -n DoubleClick1Pane copy-mode-vi \; send-keys -X select-word