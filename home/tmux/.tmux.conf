set -g status on
set -g status-interval 0
set -g status-style bg=black,fg=white
set -g status-justify centre
set -g status-left "#[fg=yellow]#{@pane_timer} "

set -g mouse on
set -s escape-time 0

set -g word-separators " @\t()[]{}<>|;&'\"\\"

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Double-click → select word
unbind -n DoubleClick1Pane
bind-key -n DoubleClick1Pane select-pane \; copy-mode \; send-keys -X select-word
unbind -T copy-mode-vi DoubleClick1Pane
bind-key -T copy-mode-vi DoubleClick1Pane send-keys -X select-word

# Triple-click → select line (no -M here, that was the bug)
unbind -n TripleClick1Pane
bind-key -n TripleClick1Pane select-pane \; copy-mode \; send-keys -X select-line
unbind -T copy-mode-vi TripleClick1Pane
bind-key -T copy-mode-vi TripleClick1Pane send-keys -X select-line