set -g status on
set -g status-interval 0
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green][#S] "
set -g status-justify centre

set -g status-left "#[fg=yellow]#{@pane_timer} "
set -g mouse on

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

bind-key -T copy-mode-vi DoubleClick1Pane send-keys -X select-word
bind-key -n DoubleClick1Pane copy-mode-vi \; send-keys -X select-word