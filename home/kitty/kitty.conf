# Generated by Home Manager.
# See https://sw.kovidgoyal.net/kitty/conf.html
# Shell integration is sourced and configured manually
shell_integration no-rc

allow_remote_control yes
confirm_os_window_close 0
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

background_image ~/.config/kitty/bg.png

# How the image should be displayed: 'linear', 'scaled', 'clamped', or 'mirrored'
background_image_layout clamped

# this doesn't do anything
background_image_linear_alpha 0.1

# this doesn't do anything
watch_config no

auto_reload_config -1

# Theme: Void
# Description: A dark, neon-purple and synthwave-inspired theme based on the Void VS Code color scheme.

# ─── Colors ──────────────────────────────────────────────────────────────────
# The basic colors
background            #0b0914
foreground            #e2d8ff
selection_background   #3d2860
selection_foreground   #e0d0ff

# Cursor colors
cursor                #cc88ff
cursor_text_color     #0b0914

# URL underline color when hovering with mouse
url_color             #a050ff

# Kitty window border colors
active_border_color   #3a2550
inactive_border_color #1a1225

# Tab bar colors
active_tab_background   #0f0c1e
active_tab_foreground   #e0d0ff
inactive_tab_background #08060f
inactive_tab_foreground #7860a8

# ─── Terminal Colors (ANSI) ──────────────────────────────────────────────────

# Black
color0  #1e1830
color8  #6a5890

# Red
color1  #ff4d9f
color9  #ff60b0

# Green
color2  #00e8a8
color10 #40f0b0

# Yellow
color3  #ffcc00
color11 #ffe040

# Blue
color4  #2090e8
color12 #60d8ff

# Magenta
color5  #cc88ff
color13 #dd80ff

# Cyan
